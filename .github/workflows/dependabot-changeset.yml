name: Dependabot Changeset

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write
  pull-requests: read

jobs:
  changeset:
    name: Auto-create Changeset
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate changeset
        run: bun tsx .changeset/generate-dependabot-changeset.ts "${{ github.event.pull_request.title }}"

      - name: Commit changeset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Collect the changeset files the generate step created.
          mapfile -t files < <(git status --porcelain --untracked-files=all -- .changeset/ | awk '{print $NF}')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ℹ️  No changeset file to commit"
            exit 0
          fi
          # Every branch requires verified commits, so create the commit through
          # the API: a commit the Actions bot makes with no custom author or
          # committer is signed by GitHub and satisfies the required_signatures rule.
          branch="${GITHUB_HEAD_REF}"
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
          base_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${base_sha}" --jq .tree.sha)"
          entries="[]"
          for file in "${files[@]}"; do
            blob_sha="$(jq -n --arg content "$(base64 -w0 "${file}")" '{content: $content, encoding: "base64"}' | gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
            entries="$(jq -c --arg path "${file}" --arg sha "${blob_sha}" '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<<"${entries}")"
          done
          tree_sha="$(jq -n --arg base "$base_tree" --argjson tree "$entries" '{base_tree: $base, tree: $tree}' | gh api "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit_sha="$(jq -n --arg msg "chore: add changeset for dependabot update [skip ci]" --arg tree "$tree_sha" --arg parent "$base_sha" '{message: $msg, tree: $tree, parents: [$parent]}' | gh api "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" -f sha="${commit_sha}"
          echo "Committed changeset as ${commit_sha}"
